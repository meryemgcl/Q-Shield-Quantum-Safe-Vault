name: Q-Shield PQC CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Suite & Security Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Code Quality & Linting (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=mobile,temp_clone

    - name: Execute Automated Unit & Regression Tests
      run: |
        python run_tests.py

    - name: Verify Phase 1 Core Benchmarks
      run: |
        python faz1_crypto_core.py

    - name: Verify Phase 2 Streaming Quantum Vault
      run: |
        python faz2_quantum_vault.py

    - name: Verify Phase 3 PQC TCP Protocol & Anti-Replay
      run: |
        python faz3_pqc_protocol.py
